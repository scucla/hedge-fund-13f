[project]
name = "hedge-fund-13f"
version = "0.1.0"
description = "Infer hedge fund strategies from SEC 13F filings, cluster similar funds, and predict next-quarter moves."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.0",
    "pyarrow>=17",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "data: needs the DuckDB database built by src.ingest.load (skipped if it doesn't exist)",
]
